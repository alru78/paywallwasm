<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paywall</title>
    <link rel="stylesheet" href="/ext-assets/paywallwasm/_lnbits/bundle.min.css" />
    <link rel="stylesheet" href="/ext-assets/paywallwasm/_lnbits/material-icons.css" />
    <link rel="stylesheet" href="/ext-assets/paywallwasm/app.css" />
  </head>
  <body class="body--dark">
    <main class="shell q-pa-md">
      <header class="q-mb-md">
        <h1 class="text-h5 text-weight-bold q-my-none">Paywall</h1>
        <p class="muted q-my-none">Unlock a link after a Lightning payment.</p>
      </header>

      <section class="panel q-pa-md q-mb-md">
        <h2 id="form-title" class="text-h6 q-mt-none q-mb-md">New paywall</h2>
        <div id="paywall-form" class="form">
          <label>
            <span class="muted">Title (also the invoice memo)</span>
            <input name="memo" maxlength="200" />
          </label>
          <label>
            <span class="muted">Description (shown before payment)</span>
            <textarea name="description" maxlength="2000"></textarea>
          </label>
          <label>
            <span class="muted">Link to unlock (kept secret until paid)</span>
            <input name="url" maxlength="2048" placeholder="https://" />
          </label>
          <div class="amount-row">
            <label>
              <span class="muted">Price</span>
              <input name="amount" inputmode="decimal" value="100" />
            </label>
            <label>
              <span class="muted">Currency</span>
              <select name="currency"></select>
            </label>
          </div>
          <label>
            <span class="muted">Wallet</span>
            <select name="walletId"></select>
          </label>
          <label class="checkbox">
            <input name="remembers" type="checkbox" />
            <span>Remember the unlock for the visitor's browser session</span>
          </label>
          <label class="checkbox">
            <input name="supportDeveloper" type="checkbox" />
            <span id="support-label">Support the developer</span>
          </label>
          <p id="support-hint" class="muted small q-my-none"></p>
          <div class="actions">
            <button id="save-button" class="q-btn bg-primary text-white" type="button">Create paywall</button>
            <button id="cancel-button" class="q-btn text-grey-2" type="button" hidden>Cancel</button>
          </div>
        </div>
      </section>

      <section id="support-panel" class="panel q-pa-md q-mb-md" hidden>
        <h2 class="text-h6 q-mt-none q-mb-sm">Developer support</h2>
        <div id="support-wallets" class="list"></div>
      </section>

      <section class="panel q-pa-md">
        <h2 class="text-h6 q-mt-none q-mb-md">Your paywalls</h2>
        <p id="empty" class="muted" hidden>No paywalls yet.</p>
        <div id="paywall-list" class="list"></div>
      </section>
    </main>
    <script src="/ext-assets/paywallwasm/lnbits-extension-sdk.js"></script>
    <script src="/ext-assets/paywallwasm/admin.js"></script>
  </body>
</html>
